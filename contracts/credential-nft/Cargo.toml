[package]
name = "credential-nft"
version = "0.1.0"
edition = "2021"
description = "NFT credential contract for ChainLearn course certificates"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
soroban-sdk = { workspace = true }
soroban-env-common = { version = "21.0.0", default-features = false }
chainlearn-shared = { path = "../../packages/shared" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
progress-tracker = { path = "../progress-tracker" }
