name: Deploy Contracts

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Build & Test Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.70
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build contracts
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  deploy:
    name: Deploy to Testnet
    needs: test
    runs-on: ubuntu-latest
    environment: testnet
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.70
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Soroban CLI
        run: cargo install --locked soroban-cli --version ^21

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Back up previous deployment record (for rollback)
        run: |
          if [ -f deployments-testnet.json ]; then
            cp deployments-testnet.json deployments-testnet.prev.json
          fi

      - name: Deploy contracts
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
        run: |
          rm -f deployments-testnet.json
          ./scripts/deploy.sh testnet

      - name: Initialize contracts
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
        run: ./scripts/initialize.sh testnet

      - name: Verify deployment
        run: |
          set -euo pipefail
          if [ ! -f deployments-testnet.json ]; then
            echo "::error::deployments-testnet.json was not created"
            exit 1
          fi
          jq empty deployments-testnet.json
          for field in learn_token credential_nft progress_tracker; do
            value=$(jq -r ".contracts.$field" deployments-testnet.json)
            if [[ ! "$value" =~ ^C[A-Z0-9]{55,62}$ ]]; then
              echo "::error::Contract ID for $field is missing or invalid: $value"
              exit 1
            fi
            echo "verified: $field -> $value"
          done

      - name: Roll back on failure
        if: failure()
        run: |
          echo "::warning::Deployment or verification failed."
          if [ -f deployments-testnet.prev.json ]; then
            mv deployments-testnet.prev.json deployments-testnet.json
            echo "::warning::Restored previous deployment record (deployments-testnet.json)."
          else
            rm -f deployments-testnet.json
            echo "::warning::No previous deployment record to restore; removed the failed one."
          fi
          echo "::warning::New contract instances remain on-chain but are not recorded as the active deployment. Re-run this workflow on a new tag once the issue is fixed."

      - name: Upload deployment record
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.ref_name }}
          path: deployments-testnet.json
